<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#3b3b3b">
<title>PDF 展台</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="css/style.css">
</head>
<body class="no-doc">

<!-- ===== 图标雪碧图 ===== -->
<svg class="sprite" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <defs>
    <g id="i-menu"><path d="M4 7h16M4 12h16M4 17h16"/></g>
    <g id="i-min"><path d="M4 5h16v14H4z"/><path d="M8 15h8"/></g>
    <g id="i-open"><path d="M3 8a2 2 0 0 1 2-2h3.6l2 2H19a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M8 13h6M11 10.5l2.5 2.5-2.5 2.5"/></g>
    <g id="i-bookmark"><path d="M7 4h10v16l-5-3.5L7 20z"/></g>
    <g id="i-cursor"><path d="M6 3.5l11.5 7.6-5 1.2-2.7 4.7z"/></g>
    <g id="i-pen"><path d="M4 20l.9-3.9L15.6 5.4a2 2 0 0 1 2.9 0l.2.2a2 2 0 0 1 0 2.9L7.9 19.1z"/><path d="M14.4 6.6l2.9 2.9"/></g>
    <g id="i-eraser"><path d="M4.6 15.4l6.8-6.8 4.6 4.6-6.8 6.8z"/><path d="M11.4 8.6l3-3a1.8 1.8 0 0 1 2.6 0l2 2a1.8 1.8 0 0 1 0 2.6l-3 3"/><path d="M9 20h11"/></g>
    <g id="i-undo"><path d="M8.5 5.5L3.5 10.5l5 5"/><path d="M3.8 10.5H14a5.6 5.6 0 0 1 0 11.2h-1.5"/></g>
    <g id="i-camera"><path d="M3 8.5h3.2l1.6-2.2h8.4l1.6 2.2H21v10.5H3z"/><circle cx="12" cy="13.4" r="3.3"/></g>
    <g id="i-export"><path d="M12 3.5v10.5"/><path d="M7.8 10l4.2 4.2L16.2 10"/><path d="M4.5 19.5h15"/></g>
    <g id="i-scan"><path d="M4 9V5.5A1.5 1.5 0 0 1 5.5 4H9"/><path d="M15 4h3.5A1.5 1.5 0 0 1 20 5.5V9"/><path d="M20 15v3.5a1.5 1.5 0 0 1-1.5 1.5H15"/><path d="M9 20H5.5A1.5 1.5 0 0 1 4 18.5V15"/><path d="M7.5 12h9"/></g>
    <g id="i-bulb"><path d="M9.2 18h5.6"/><path d="M10.2 21h3.6"/><path d="M12 3a6 6 0 0 1 3.4 10.9V16h-6.8v-2.1A6 6 0 0 1 12 3z"/></g>
    <g id="i-sliders"><path d="M4 8h4.6M12.2 8H20"/><circle cx="10.4" cy="8" r="2.2"/><path d="M4 16h7.6M15.4 16H20"/><circle cx="13.6" cy="16" r="2.2"/></g>
    <g id="i-gear"><circle cx="12" cy="12" r="3.2"/><circle cx="12" cy="12" r="8"/><path d="M12 2.4v3.4M12 18.2v3.4M2.4 12h3.4M18.2 12h3.4M5.2 5.2l2.4 2.4M16.4 16.4l2.4 2.4M18.8 5.2l-2.4 2.4M7.6 16.4l-2.4 2.4"/></g>
    <g id="i-up"><path d="M6 15l6-6 6 6"/></g>
    <g id="i-compare"><path d="M12 6.5C10 4.8 7 4.4 4 5v13.5c3-.6 6-.2 8 1.5 2-1.7 5-2.1 8-1.5V5c-3-.6-6-.2-8 1.5z"/><path d="M12 6.5V20"/></g>
    <g id="i-save"><path d="M5 4h11l3 3v13H5z"/><path d="M8.5 4v4.5h7V4"/><path d="M8 20v-6h8v6"/></g>
    <g id="i-close"><path d="M6 6l12 12M18 6L6 18"/></g>
    <g id="i-left"><path d="M15 5l-7 7 7 7"/></g>
    <g id="i-right"><path d="M9 5l7 7-7 7"/></g>
    <g id="i-plus"><path d="M12 5v14M5 12h14"/></g>
    <g id="i-minus"><path d="M5 12h14"/></g>
    <g id="i-file"><path d="M7 3h7l4 4v14H7z"/><path d="M14 3v4h4"/></g>
    <g id="i-trash"><path d="M5 7h14"/><path d="M9.5 7V4h5v3"/><path d="M7 7l1 13h8l1-13"/></g>
    <g id="i-check"><path d="M5 12.5l4.5 4.5L19 7"/></g>
  </defs>
</svg>

<!-- ===== 阅读区 ===== -->
<div class="stage" id="stage">
  <div class="pane" id="paneA">
    <div class="sheet" id="sheetA">
      <canvas id="canvasA"></canvas>
      <svg class="ink" id="inkA" xmlns="http://www.w3.org/2000/svg"></svg>
    </div>
    <div class="empty" id="empty">
      <div class="empty-inner">
        <svg class="empty-ic"><use xlink:href="#i-file"/></svg>
        <div class="empty-t">拖入 PDF 文件，或点击下方「打开」</div>
        <div class="empty-s">支持批注 / 橡皮 / 撤销 / 双页对比 / 导出</div>
        <button class="empty-btn" id="emptyOpen">打开 PDF</button>
      </div>
    </div>
  </div>
  <div class="pane" id="paneB" hidden>
    <div class="sheet" id="sheetB">
      <canvas id="canvasB"></canvas>
      <svg class="ink" id="inkB" xmlns="http://www.w3.org/2000/svg"></svg>
    </div>
  </div>
</div>

<div class="brand" id="brand">
  <svg class="brand-ic"><use xlink:href="#i-file"/></svg><span>PDF 展台</span>
</div>

<!-- ===== 右下角翻页（希沃白板样式） ===== -->
<div class="pager" id="pager">
  <button class="pg-btn flip" id="prevPage" title="上一页 (←)"><svg><use xlink:href="#i-left"/></svg></button>
  <span class="pg-txt"><b id="pageNow">-</b><i>/</i><span id="pageAll">-</span></span>
  <button class="pg-btn flip" id="nextPage" title="下一页 (→)"><svg><use xlink:href="#i-right"/></svg></button>
</div>

<!-- ===== 橡皮擦：右滑清空 ===== -->
<div class="erasebar" id="erasebar" hidden>
  <span class="eb-thumb" id="ebThumb"><svg class="ic"><use xlink:href="#i-eraser"/></svg></span>
  <span class="eb-txt">向右滑动擦除所有批注</span>
</div>

<!-- ===== 橡皮擦光标 ===== -->
<div class="eraser-cursor" id="eraserCursor" hidden>
  <svg class="ic"><use xlink:href="#i-eraser"/></svg>
</div>

<!-- ===== 缩放 ===== -->
<div class="zoombar" id="zoombar">
  <button class="pg-btn" id="zoomOut" title="缩小 (-)"><svg><use xlink:href="#i-minus"/></svg></button>
  <span class="pg-txt zoom" id="zoomTxt">100%</span>
  <button class="pg-btn" id="zoomIn" title="放大 (+)"><svg><use xlink:href="#i-plus"/></svg></button>
</div>

<!-- ===== 主工具条 ===== -->
<div class="toolbar toolbar-main" id="barMain">
  <button class="tbtn" data-act="menu" title="菜单">
    <span class="corner c1"></span><span class="corner c2"></span><span class="corner c3"></span><span class="corner c4"></span>
    <svg class="ic"><use xlink:href="#i-menu"/></svg><span class="lb">菜单</span>
  </button>
  <button class="tbtn" data-act="minimize" title="最小化">
    <span class="corner c1"></span><span class="corner c2"></span><span class="corner c3"></span><span class="corner c4"></span>
    <svg class="ic"><use xlink:href="#i-min"/></svg><span class="lb">最小化</span>
  </button>
  <button class="tbtn" data-act="open" title="打开 PDF (Ctrl+O)">
    <span class="corner c1"></span><span class="corner c2"></span><span class="corner c3"></span><span class="corner c4"></span>
    <svg class="ic"><use xlink:href="#i-open"/></svg><span class="lb">打开</span>
  </button>
  <button class="tbtn" data-act="bookmark" title="添加 / 取消书签">
    <span class="corner c1"></span><span class="corner c2"></span><span class="corner c3"></span><span class="corner c4"></span>
    <svg class="ic"><use xlink:href="#i-bookmark"/></svg><span class="lb">书签</span>
  </button>

  <span class="divider"></span>

  <button class="tbtn active" data-mode="move" title="移动 / 拖动页面 (V)">
    <span class="corner c1"></span><span class="corner c2"></span><span class="corner c3"></span><span class="corner c4"></span>
    <svg class="ic"><use xlink:href="#i-cursor"/></svg><span class="lb">移动</span>
  </button>
  <button class="tbtn" data-mode="pen" title="批注 (P)">
    <span class="corner c1"></span><span class="corner c2"></span><span class="corner c3"></span><span class="corner c4"></span>
    <svg class="ic"><use xlink:href="#i-pen"/></svg><span class="lb">批注</span>
  </button>
  <button class="tbtn" data-mode="eraser" title="橡皮 (E)">
    <span class="corner c1"></span><span class="corner c2"></span><span class="corner c3"></span><span class="corner c4"></span>
    <svg class="ic"><use xlink:href="#i-eraser"/></svg><span class="lb">橡皮</span>
  </button>
  <button class="tbtn" data-act="undo" title="撤销 (Ctrl+Z)">
    <span class="corner c1"></span><span class="corner c2"></span><span class="corner c3"></span><span class="corner c4"></span>
    <svg class="ic"><use xlink:href="#i-undo"/></svg><span class="lb">撤销</span>
  </button>

  <span class="divider"></span>

  <button class="tbtn" data-act="shot" title="截图当前页面">
    <span class="corner c1"></span><span class="corner c2"></span><span class="corner c3"></span><span class="corner c4"></span>
    <svg class="ic"><use xlink:href="#i-camera"/></svg><span class="lb">截图</span>
  </button>
  <button class="tbtn" data-act="export" title="导出带批注的 PDF">
    <span class="corner c1"></span><span class="corner c2"></span><span class="corner c3"></span><span class="corner c4"></span>
    <svg class="ic"><use xlink:href="#i-export"/></svg><span class="lb">导出</span>
  </button>
  <button class="tbtn" data-act="thumbs" title="页面缩略图">
    <span class="corner c1"></span><span class="corner c2"></span><span class="corner c3"></span><span class="corner c4"></span>
    <svg class="ic"><use xlink:href="#i-scan"/></svg><span class="lb">缩略图</span>
  </button>
  <button class="tbtn" data-act="lamp" title="护眼暖色">
    <span class="corner c1"></span><span class="corner c2"></span><span class="corner c3"></span><span class="corner c4"></span>
    <svg class="ic"><use xlink:href="#i-bulb"/></svg><span class="lb">护眼</span>
  </button>
  <button class="tbtn" data-act="adjust" title="画面调节">
    <span class="corner c1"></span><span class="corner c2"></span><span class="corner c3"></span><span class="corner c4"></span>
    <svg class="ic"><use xlink:href="#i-sliders"/></svg><span class="lb">画面调节</span>
  </button>
  <button class="tbtn" data-act="settings" title="设置">
    <span class="corner c1"></span><span class="corner c2"></span><span class="corner c3"></span><span class="corner c4"></span>
    <svg class="ic"><use xlink:href="#i-gear"/></svg><span class="lb">设置</span>
  </button>
</div>

<!-- ===== 右侧工具条 ===== -->
<div class="toolbar toolbar-right" id="barRight">
  <button class="tbtn" data-act="immerse" title="展开 / 收起工具栏">
    <span class="corner c1"></span><span class="corner c2"></span><span class="corner c3"></span><span class="corner c4"></span>
    <svg class="ic" id="immerseIc"><use xlink:href="#i-up"/></svg><span class="lb">展开</span>
  </button>
  <button class="tbtn wide" data-act="compare" title="对比教学：左右双页">
    <span class="corner c1"></span><span class="corner c2"></span><span class="corner c3"></span><span class="corner c4"></span>
    <svg class="ic"><use xlink:href="#i-compare"/></svg><span class="lb">对比教学</span>
  </button>
  <button class="tbtn" data-act="save" title="保存批注 (Ctrl+S)">
    <span class="corner c1"></span><span class="corner c2"></span><span class="corner c3"></span><span class="corner c4"></span>
    <svg class="ic"><use xlink:href="#i-save"/></svg><span class="lb">保存</span>
  </button>
</div>

<!-- 沉浸模式的唤出条 -->
<div class="reveal" id="reveal"><span></span></div>

<!-- ===== 浮层 ===== -->
<div class="popover" id="pop" hidden></div>
<div class="drawer" id="drawer" hidden>
  <div class="drawer-head">
    <div class="drawer-tabs">
      <button class="dtab active" data-tab="thumbs">缩略图</button>
      <button class="dtab" data-tab="marks">书签</button>
    </div>
    <button class="dclose" id="drawerClose"><svg><use xlink:href="#i-close"/></svg></button>
  </div>
  <div class="drawer-body" id="drawerBody"></div>
</div>
<div class="toast" id="toast" hidden></div>
<div class="busy" id="busy" hidden><div class="spinner"></div><div class="busy-t" id="busyT">正在处理…</div></div>
<input type="file" id="fileInput" accept="application/pdf,.pdf" hidden>
<input type="file" id="fileInputB" accept="application/pdf,.pdf" hidden>

<script src="vendor/pdf.min.js"></script>
<script src="vendor/pdf-lib.min.js"></script>
<script src="js/app.js"></script>
</body>
</html>
